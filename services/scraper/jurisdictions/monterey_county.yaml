# Monterey County, California
#
# `sources` auto-enumerates every active body on a tenant. The `name_prefix`
# disambiguates so e.g. "City Council" from salinas tenant becomes
# "City of Salinas - City Council".
#
# `bodies` lists explicit entries for platforms we don't have adapters for
# (Granicus ViewPublisher, BoardDocs, OnBase, custom HTML, Municode).
# Their meeting data is in supabase/seeds/manual_meetings.sql or absent.

jurisdiction:
  name: "Monterey County"
  slug: "monterey-county"
  state: "CA"
  type: "county"
  parent_state: "California"

sources:
  # County government — every active body on the monterey Legistar tenant.
  - adapter: legistar
    category: county_government
    config:
      tenant: monterey

  # City of Salinas — every active body on the salinas Legistar tenant.
  - adapter: legistar
    category: municipal_government
    name_prefix: "City of Salinas - "
    config:
      tenant: salinas

  # City of Carmel-by-the-Sea — CivicClerk.
  - adapter: civicclerk
    category: municipal_government
    name_prefix: "City of Carmel-by-the-Sea - "
    config:
      tenant: carmelbytheseaca

  # City of Seaside — CivicClerk.
  - adapter: civicclerk
    category: municipal_government
    name_prefix: "City of Seaside - "
    config:
      tenant: seasideca

  # Monterey One Water (regional wastewater) — CivicClerk.
  - adapter: civicclerk
    category: special_district
    name_prefix: "Monterey One Water - "
    config:
      tenant: montereyonewater

bodies:
  # ---- Municipal: cities on platforms we don't yet have adapters for ----
  - name: "City of Monterey - City Council"
    slug: "monterey-city-council"
    category: "municipal_government"
    adapter: "manual"

  - name: "City of Pacific Grove - City Council"
    slug: "pacific-grove-city-council"
    category: "municipal_government"
    adapter: "manual"

  - name: "City of Marina - City Council"
